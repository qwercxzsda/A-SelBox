# Fresh local PostgreSQL 17 stack. Other services use Supabase CLI defaults.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "db"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
port = 54323
api_url = "http://127.0.0.1"

[storage]
file_size_limit = "50MiB"

[storage.vector]
enabled = false
