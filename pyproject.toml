[tool.sqlfluff.core]
dialect = "postgres"
templater = "raw"
sql_file_exts = ".sql"
max_line_length = 0

[tool.pymarkdown]
plugins.line-length.enabled = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "ANN",
  "ARG",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "G",
  "I",
  "LOG",
  "N",
  "PIE",
  "PLE",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]

[tool.pyright]
pythonVersion = "3.14"
# Third-party packages lack stub packages; strict unknown-type diagnostics still apply.
reportMissingTypeStubs = false
typeCheckingMode = "strict"
